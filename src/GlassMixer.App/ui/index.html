<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Glass Mixer</title>
  <!-- The mockup's typefaces, shipped with the app (tools/get-fonts.ps1), so no internet is needed. -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <section class="panel" id="panel" aria-label="Volume mixer">
    <div class="grip" id="grip" title="Drag to resize" aria-hidden="true"></div>
    <span class="size-badge" id="size-badge" hidden></span>

    <header class="p-head" id="p-head">
      <div class="p-title"><h1>Volume</h1><span>Drag to move · double-click to dock</span></div>
      <div class="p-actions">
        <button class="icon-btn" id="btn-pin" aria-pressed="true" title="Keep on top" aria-label="Keep on top"></button>
        <button class="icon-btn" id="btn-look" aria-expanded="false" aria-controls="look" title="Appearance" aria-label="Appearance"></button>
        <button class="icon-btn" id="btn-min" title="Minimize (Ctrl+Alt+M)" aria-label="Minimize volume mixer"></button>
        <button class="icon-btn" id="btn-close" title="Hide" aria-label="Hide volume mixer"></button>
      </div>
    </header>

    <div class="p-scroll" id="p-scroll">
      <section class="master" data-id="master">
        <label class="dev" for="dev"><span id="dev-icon"></span><span class="dev-wrap"><select id="dev" aria-label="Output device"></select><span id="dev-chev"></span></span></label>
        <div class="master-row">
          <button class="icon-btn mute" data-mute="master" aria-pressed="false" aria-label="Mute all"></button>
          <div>
            <input type="range" class="vol" id="vol-master" min="0" max="100" aria-label="Master volume">
            <div class="meter"><i></i><b></b></div>
          </div>
          <span class="val vval" id="val-master">0</span>
        </div>
      </section>

      <section class="look" id="look" hidden aria-label="Appearance">
        <label class="look-row" for="opt-clear">Transparency <input type="range" id="opt-clear" min="0" max="100"><span class="val" id="val-clear"></span></label>
        <label class="look-row" for="opt-blur" title="While the blur is on, the mixer is left out of screenshots and screen sharing. Set it to 0 to show it.">Background blur <input type="range" id="opt-blur" min="0" max="40"><span class="val" id="val-blur"></span></label>
        <div class="look-row"><span>Panel size</span>
          <div class="seg span" role="group" aria-label="Panel size">
            <button data-size="compact" aria-pressed="false">Compact</button>
            <button data-size="regular" aria-pressed="false">Regular</button>
            <button data-size="wide" aria-pressed="false">Wide</button>
          </div>
        </div>
        <label class="look-check" for="opt-meters"><input type="checkbox" id="opt-meters"> Show live level meters</label>
      </section>

      <div class="bar">
        <div class="chips" id="chips" role="group" aria-label="Sound profiles"></div>
        <div class="seg" role="group" aria-label="Layout">
          <button id="mode-list" aria-pressed="true">List</button>
          <button id="mode-board" aria-pressed="false">Mixer</button>
        </div>
      </div>

      <div class="section-label"><span>Apps</span><span id="app-count"></span></div>
      <ul class="list" id="list"></ul>
      <div class="board" id="board" hidden></div>
      <p class="empty" id="empty" hidden>No app is playing sound right now. Start music or a video and it shows up here.</p>
    </div>

    <footer class="p-foot">
      <span class="live" id="foot-live">Output</span>
      <span class="foot-keys"><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>V</kbd> shows or hides</span>
    </footer>
  </section>

  <div class="mini" id="mini" data-id="master" hidden>
    <span class="mini-drag" id="mini-drag" title="Drag to move"></span>
    <button class="icon-btn mute" data-mute="master" aria-pressed="false" aria-label="Mute all"></button>
    <div class="mini-vol">
      <input type="range" class="vol" id="vol-mini" min="0" max="100" aria-label="Master volume">
      <div class="meter"><i></i><b></b></div>
    </div>
    <span class="val vval" id="val-mini">0</span>
    <div class="mini-apps" id="mini-apps"></div>
    <button class="icon-btn" id="btn-restore" title="Expand (Ctrl+Alt+M)" aria-label="Expand volume mixer"></button>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
