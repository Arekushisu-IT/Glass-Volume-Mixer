<title>Glass Volume Mixer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Manrope:wght@400;500;600;700&family=Sora:wght@600&display=swap">
<style>
/* Layout: a desktop scene. The glass mixer floats bottom-right over real windows and wallpaper; a glass taskbar runs along the bottom with the tray speaker that opens it. */
:root {
  --wall-base: #d6dfe0; --wall-a: #efb06a; --wall-b: #4fb3a6; --wall-c: #e2836d;
  --glass-rgb: 248 251 251;
  --glass-a: .30;
  --blur: 20px;
  --edge: rgb(255 255 255 / .72);
  --edge-2: rgb(17 32 30 / .10);
  --halo: rgb(255 255 255 / .55);
  --fg: #11201e; --fg-2: #354745; --fg-3: rgb(17 32 30 / .52);
  --accent: #0b857b; --accent-fg: #ffffff;
  --track: rgb(17 32 30 / .15);
  --hover: rgb(17 32 30 / .07);
  --thumb: #ffffff;
  --ok: #2aa86c; --warn: #dc9c25; --hot: #de553a;
  --win-bg: rgb(255 255 255 / .88); --win-bar: #eaf0f0;
  --c1: #0b857b; --c2: #c06c34; --c3: #9aa6a5; --c4: #5b6ad0;
  --shadow: rgb(14 30 28 / .30);
  --app-music: #1f9a55; --app-web: #3a78d4; --app-voice: #5961d1; --app-engine: #3c4447; --app-media: #e2761c; --app-sys: #6f8284;
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall-base: #0b1114; --wall-a: #93501e; --wall-b: #0d615c; --wall-c: #6a2b32;
    --glass-rgb: 14 20 24;
    --edge: rgb(255 255 255 / .14); --edge-2: rgb(255 255 255 / .07);
    --halo: rgb(0 0 0 / .45);
    --fg: #edf4f3; --fg-2: #b3c3c1; --fg-3: rgb(237 244 243 / .50);
    --accent: #45cfc1; --accent-fg: #062421;
    --track: rgb(255 255 255 / .17);
    --hover: rgb(255 255 255 / .07);
    --thumb: #f2faf9;
    --win-bg: rgb(26 34 38 / .92); --win-bar: #1f292d;
    --c1: #45cfc1; --c2: #e09a5e; --c3: #59696a; --c4: #8e99f0;
    --shadow: rgb(0 0 0 / .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall-base: #0b1114; --wall-a: #93501e; --wall-b: #0d615c; --wall-c: #6a2b32;
  --glass-rgb: 14 20 24;
  --edge: rgb(255 255 255 / .14); --edge-2: rgb(255 255 255 / .07);
  --halo: rgb(0 0 0 / .45);
  --fg: #edf4f3; --fg-2: #b3c3c1; --fg-3: rgb(237 244 243 / .50);
  --accent: #45cfc1; --accent-fg: #062421;
  --track: rgb(255 255 255 / .17);
  --hover: rgb(255 255 255 / .07);
  --thumb: #f2faf9;
  --win-bg: rgb(26 34 38 / .92); --win-bar: #1f292d;
  --c1: #45cfc1; --c2: #e09a5e; --c3: #59696a; --c4: #8e99f0;
  --shadow: rgb(0 0 0 / .55);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { height: 100%; background: var(--wall-base); color: var(--fg); font-family: var(--f-body); font-size: 14px; }
button, select, input { font: inherit; color: inherit; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- desktop scene ---------- */
.desk {
  position: relative; height: 100%; min-height: 620px; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  isolation: isolate;
}
.wall {
  position: absolute; inset: -10%; z-index: -1;
  background:
    radial-gradient(38% 46% at 80% 66%, var(--wall-a), transparent 70%),
    radial-gradient(44% 52% at 18% 24%, var(--wall-b), transparent 72%),
    radial-gradient(34% 40% at 52% 98%, var(--wall-c), transparent 70%),
    var(--wall-base);
  animation: drift 38s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate(3%, -2%) scale(1.04); } }

.desk-note {
  position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); z-index: 3;
  max-width: calc(100% - 32px);
  padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--fg-2);
  background: rgb(var(--glass-rgb) / .55); border: 1px solid var(--edge);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}

.win {
  position: absolute; background: var(--win-bg); border: 1px solid var(--edge-2);
  border-radius: 12px; overflow: hidden; box-shadow: 0 22px 50px -22px var(--shadow);
}
.win-bar {
  height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--win-bar); font-size: 12px; font-weight: 600; color: var(--fg-2);
}
.win-bar .dots { display: flex; gap: 6px; }
.win-bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--c3); }
.win-ed { left: 4%; top: 64px; width: min(600px, 90%); height: min(390px, 56%); }
.ed-body { display: grid; gap: 9px; padding: 16px 18px; font-family: var(--f-mono); }
.ed-line { display: flex; gap: 8px; align-items: center; height: 10px; }
.ed-line .n { width: 18px; font-size: 10px; color: var(--c3); text-align: right; }
.ed-line i { height: 8px; border-radius: 4px; opacity: .85; }
.win-ph { left: 44%; top: 30%; width: min(480px, 82%); height: 330px; }
.photo {
  position: absolute; inset: 34px 0 0;
  background:
    radial-gradient(circle at 70% 42%, #fff4d6 0 7%, #ffd99a 8% 11%, transparent 26%),
    radial-gradient(120% 60% at 20% 105%, #1d4a48 0 45%, transparent 46%),
    radial-gradient(110% 55% at 85% 112%, #2c6560 0 48%, transparent 49%),
    linear-gradient(#f6c98d, #ea8d6c 52%, #7d4b68);
}

/* ---------- glass panel ---------- */
.panel {
  position: absolute; z-index: 5;
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: 66px;
  width: min(404px, calc(100% - 32px)); max-height: calc(100% - 66px - 56px);
  display: flex; flex-direction: column;
  container: mixer / inline-size;
  background: rgb(var(--glass-rgb) / var(--glass-a));
  backdrop-filter: blur(var(--blur)) saturate(170%); -webkit-backdrop-filter: blur(var(--blur)) saturate(170%);
  border: 1px solid var(--edge); border-radius: 18px;
  box-shadow: 0 28px 64px -18px var(--shadow), inset 0 1px 0 var(--edge);
  text-shadow: 0 1px 1px var(--halo);
  transition: box-shadow .2s;
}
.panel.pop { animation: pop .22s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes pop { from { transform: translateY(10px) scale(.98); opacity: .4; } }
.panel.dragging, .panel.resizing { box-shadow: 0 40px 80px -18px var(--shadow), inset 0 1px 0 var(--edge); }
.panel.resizing { user-select: none; }

.grip {
  position: absolute; left: 0; top: 0; z-index: 2; width: 22px; height: 22px; border-top-left-radius: 18px;
  display: grid; place-items: center; cursor: nwse-resize; touch-action: none; color: var(--fg-3);
}
.grip:hover, .resizing .grip { color: var(--accent); }
.grip svg { width: 12px; height: 12px; stroke-width: 1.6; }
.size-badge {
  position: absolute; top: 10px; left: 50%; z-index: 3; transform: translateX(-50%);
  padding: 4px 10px; border-radius: 999px; white-space: nowrap; pointer-events: none;
  font: 500 11px var(--f-mono); font-variant-numeric: tabular-nums; text-shadow: none;
  background: var(--accent); color: var(--accent-fg);
}

.p-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 12px 12px 6px 18px; cursor: grab; touch-action: none; user-select: none;
}
.dragging .p-head { cursor: grabbing; }
.p-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.p-title h1 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.p-title span { font-size: 11px; color: var(--fg-3); white-space: nowrap; }
.p-actions { display: flex; gap: 2px; }

.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px;
  border: 0; background: transparent; color: var(--fg-2); cursor: pointer;
}
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn[aria-pressed="true"], .icon-btn[aria-expanded="true"] { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.p-scroll {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 0 12px 4px; display: flex; flex-direction: column; gap: 10px;
}
.p-scroll > * { flex: none; }

/* master */
.master {
  display: grid; gap: 8px; padding: 12px 12px 12px 14px; border-radius: 14px;
  background: rgb(var(--glass-rgb) / .35); border: 1px solid var(--edge);
}
.dev { position: relative; display: flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: 12px; font-weight: 600; }
.dev select {
  appearance: none; -webkit-appearance: none; border: 0; background: transparent; cursor: pointer;
  padding: 2px 22px 2px 0; font-weight: 700; color: var(--fg); min-width: 0; max-width: 100%; text-overflow: ellipsis;
}
.dev .chev { position: absolute; right: 0; pointer-events: none; width: 14px; height: 14px; }
.dev-wrap { position: relative; display: flex; align-items: center; min-width: 0; }
.master-row { display: grid; grid-template-columns: auto 1fr 40px; align-items: center; gap: 10px; }
.val { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; color: var(--fg); }
.master .val { font-size: 15px; }

/* range */
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer;
  --fill: var(--accent); --a: 0%; --p: 50%;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 99px;
  background: linear-gradient(to right, var(--track) var(--a), var(--fill) var(--a), var(--fill) var(--p), var(--track) var(--p));
}
input[type="range"]::-moz-range-track {
  height: 6px; border-radius: 99px;
  background: linear-gradient(to right, var(--track) var(--a), var(--fill) var(--a), var(--fill) var(--p), var(--track) var(--p));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%;
  background: var(--thumb); border: 0; box-shadow: 0 1px 4px var(--shadow), 0 0 0 1px var(--edge-2);
  transition: transform .12s;
}
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%; border: 0;
  background: var(--thumb); box-shadow: 0 1px 4px var(--shadow), 0 0 0 1px var(--edge-2);
}
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.18); }
input[type="range"]:focus-visible { outline-offset: 4px; border-radius: 6px; }

.meter { position: relative; height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; margin: 1px 8px 0; }
.meter i {
  position: absolute; inset: 0; clip-path: inset(0 100% 0 0);
  background: linear-gradient(90deg, var(--ok) 0 62%, var(--warn) 80%, var(--hot));
}
.meter b { position: absolute; top: 0; bottom: 0; width: 2px; left: 0; background: var(--fg-2); opacity: .55; }
.no-meters .meter, .no-meters .vmeter { visibility: hidden; }

/* look / appearance */
.look { display: grid; gap: 10px; padding: 12px 14px; border-radius: 14px; border: 1px dashed var(--edge); background: rgb(var(--glass-rgb) / .25); }
.look-row { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: var(--fg-2); }
.look-row .sizes { grid-column: 2 / 4; justify-self: start; }
.look-check { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--fg-2); cursor: pointer; }
.look-check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

/* toolbar */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  border: 1px solid var(--edge); background: transparent; border-radius: 999px; padding: 4px 10px;
  font-size: 12px; font-weight: 600; color: var(--fg-2); cursor: pointer;
}
.chip:hover { background: var(--hover); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); text-shadow: none; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--hover); }
.seg button {
  border: 0; background: transparent; border-radius: 7px; padding: 4px 10px; font-size: 12px; font-weight: 700;
  color: var(--fg-2); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: rgb(var(--glass-rgb) / .9); color: var(--fg); box-shadow: 0 1px 3px var(--shadow); }

.section-label {
  display: flex; justify-content: space-between; font-size: 11px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); padding: 2px 4px 0;
}
.section-label span:last-child { letter-spacing: 0; text-transform: none; font-weight: 600; }

/* list */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.app { border-radius: 12px; padding: 8px 4px 8px 8px; transition: background .15s; }
.app:hover { background: var(--hover); }
.app.flash { animation: flash 1.1s ease-out; }
@keyframes flash { 0%, 30% { background: rgb(from var(--accent) r g b / .22); } }
.app-main { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; }
.app-icon {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff;
  background: var(--c); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .18), 0 2px 6px -2px var(--shadow);
  transition: filter .2s, opacity .2s;
}
.app-icon svg { width: 19px; height: 19px; }
.app-body { min-width: 0; display: grid; gap: 1px; }
.app-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-right: 2px; }
.app-name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-sub { font-size: 11.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app .val { font-size: 12px; color: var(--fg-2); }
.is-muted .app-icon, .is-muted.strip .app-icon { filter: grayscale(1); opacity: .5; }
.is-muted input[type="range"] { --fill: var(--fg-3); }
.is-muted .val { color: var(--fg-3); }
.is-muted .mute { color: var(--hot); }
.more svg { transition: transform .2s; }
.more[aria-expanded="true"] svg { transform: rotate(180deg); }

.app-extra { display: grid; gap: 8px; margin: 8px 0 2px 46px; padding: 10px 12px; border-radius: 10px; background: rgb(var(--glass-rgb) / .35); }
.extra-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 52px; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: var(--fg-2); }
.extra-row select {
  grid-column: 2 / 4; min-width: 0; padding: 5px 8px; border-radius: 8px;
  border: 1px solid var(--edge); background: rgb(var(--glass-rgb) / .6); font-size: 12px; font-weight: 600;
}
.extra-row .val { font-size: 11px; }

/* mixer board */
/* The board grows with the panel: when the panel is made taller, the faders get longer. */
.p-scroll > .board { flex: 1 0 auto; }
.board { display: flex; gap: 4px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: thin; }
.strip {
  flex: 1 0 60px; max-width: 104px; display: grid; grid-template-rows: auto 1fr auto auto auto;
  justify-items: center; gap: 8px; padding: 10px 0 8px; border-radius: 12px;
}
.strip:hover { background: var(--hover); }
.strip.master-strip { flex: 1 0 68px; background: rgb(var(--glass-rgb) / .35); border: 1px solid var(--edge); margin-right: 6px; }
.strip .app-icon { width: 30px; height: 30px; border-radius: 9px; }
.strip .app-icon svg { width: 16px; height: 16px; }
.fader-zone { display: flex; gap: 6px; min-height: clamp(120px, 22vh, 200px); }
.vmeter { position: relative; width: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
.vmeter i {
  position: absolute; inset: 0; clip-path: inset(100% 0 0 0);
  background: linear-gradient(0deg, var(--ok) 0 62%, var(--warn) 80%, var(--hot));
}
.fader { --p: 50%; --fill: var(--accent); position: relative; width: 26px; cursor: ns-resize; touch-action: none; border-radius: 8px; }
.fader::before, .fader .fill { content: ""; position: absolute; left: 50%; width: 6px; transform: translateX(-50%); border-radius: 99px; }
.fader::before { top: 0; bottom: 0; background: var(--track); }
.fader .fill { bottom: 0; height: var(--p); background: var(--fill); }
.fader .knob {
  position: absolute; left: 50%; bottom: var(--p); width: 26px; height: 14px; transform: translate(-50%, 50%);
  border-radius: 5px; background: var(--thumb); box-shadow: 0 2px 5px var(--shadow), 0 0 0 1px var(--edge-2);
}
.fader .knob::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 2px; margin-top: -1px; border-radius: 1px; background: var(--fill); }
.is-muted .fader { --fill: var(--fg-3); }
.strip-name { width: 56px; text-align: center; font-size: 11px; font-weight: 600; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .icon-btn { width: 28px; height: 28px; }

.p-foot {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 10px 18px 12px;
  border-top: 1px solid var(--edge-2); font-size: 11.5px; color: var(--fg-3);
}
kbd {
  font-family: var(--f-mono); font-size: 10.5px; padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--edge); background: rgb(var(--glass-rgb) / .5); color: var(--fg-2);
}
.live { color: var(--fg-2); font-weight: 600; }
.live::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--ok); vertical-align: 1px; }

/* ---------- taskbar ---------- */
.taskbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 52px; z-index: 4;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgb(var(--glass-rgb) / calc(var(--glass-a) + .28));
  backdrop-filter: blur(26px) saturate(160%); -webkit-backdrop-filter: blur(26px) saturate(160%);
  border-top: 1px solid var(--edge);
}
.tb-start { justify-self: start; }
.tb-start svg { width: 20px; height: 20px; }
.tb-apps { display: flex; gap: 4px; }
.tb-app { position: relative; width: 38px; height: 38px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center; cursor: pointer; }
.tb-app:hover { background: var(--hover); }
.tb-app .app-icon { width: 26px; height: 26px; border-radius: 7px; }
.tb-app .app-icon svg { width: 14px; height: 14px; }
.tb-app::after {
  content: ""; position: absolute; bottom: 2px; left: 50%; width: 6px; height: 3px; margin-left: -3px; border-radius: 2px;
  background: var(--fg-3); transition: width .2s, margin .2s, background .2s;
}
.tb-app.sounding::after { width: 14px; margin-left: -7px; background: var(--accent); }
.tray { justify-self: end; display: flex; align-items: center; gap: 4px; }
.tray-vol { width: auto; padding: 0 8px; gap: 6px; display: inline-flex; font-family: var(--f-mono); font-size: 12px; color: var(--fg); }
.clock { font-size: 12px; font-weight: 600; text-align: right; line-height: 1.25; color: var(--fg); padding: 0 4px; white-space: nowrap; }
.clock small { display: block; font-size: 11px; font-weight: 500; color: var(--fg-2); }

/* ---------- minimized: a small glass bar ---------- */
.panel.is-min {
  width: auto !important; height: auto !important; max-width: calc(100% - 32px);
  container-type: normal; border-radius: 14px;
}
.mini { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 4px; touch-action: none; }
.mini-drag { display: grid; place-items: center; width: 18px; height: 32px; cursor: grab; color: var(--fg-3); }
.mini-drag svg { width: 14px; height: 14px; stroke-width: 2.4; }
.dragging .mini-drag { cursor: grabbing; }
.mini-vol { width: 150px; min-width: 0; flex: 1 1 150px; }
.mini .val { width: 28px; }
.mini-apps { display: flex; gap: 2px; padding-left: 8px; margin-left: 2px; border-left: 1px solid var(--edge-2); }
.mini-app { border: 0; background: transparent; padding: 3px; border-radius: 8px; cursor: pointer; display: grid; }
.mini-app:hover { background: var(--hover); }
.mini-app .app-icon { width: 22px; height: 22px; border-radius: 6px; opacity: .4; filter: grayscale(.7); }
.mini-app .app-icon svg { width: 12px; height: 12px; }
.mini-app.sounding .app-icon { opacity: 1; filter: none; }

/* ---------- the panel adapts to its own width ---------- */
@container mixer (min-width: 560px) {
  .list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; align-items: start; }
  .app { background: rgb(var(--glass-rgb) / .22); }
  .master-row { gap: 14px; }
}
@container mixer (min-width: 840px) {
  .list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@container mixer (max-width: 340px) {
  .p-title span, .foot-keys, .app-sub { display: none; }
  .app-main { gap: 8px; }
  .chip { padding: 3px 8px; }
  .look-row { grid-template-columns: 78px 1fr 40px; }
  .app-extra { margin-left: 0; }
  .extra-row { grid-template-columns: 54px minmax(0, 1fr) 46px; }
}
@container mixer (max-width: 290px) {
  .more, .section-label span:last-child, .chips { display: none; }
  .app-main { grid-template-columns: 30px minmax(0, 1fr) auto; }
  .app .app-icon { width: 30px; height: 30px; border-radius: 9px; }
  .app-extra { display: none !important; }
  .master { padding: 10px; }
}

@media (max-width: 520px) {
  .clock, .tb-start { display: none; }
  .taskbar { grid-template-columns: 1fr auto; }
  .tb-apps { justify-self: start; }
  .tb-app { width: 34px; }
  .p-title span { display: none; }
  .app-extra { margin-left: 0; }
  .mini-apps { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .wall, .panel.pop, .app.flash { animation: none; }
  * { transition: none !important; }
}

<div class="desk" id="desk">
  <div class="wall" aria-hidden="true"></div>
  <p class="desk-note" id="desk-note">Desktop app mockup. Drag the header to move, the top-left corner to resize, and use the minus button to minimize.</p>

  <div class="win win-ed" aria-hidden="true">

    <div class="ed-body" id="ed-body"></div>
  </div>
  <div class="win win-ph" aria-hidden="true">
    <div class="win-bar"><span class="dots"><i></i><i></i><i></i></span>Photos · Sarangani Bay, dusk.jpg</div>
    <div class="photo"></div>

  <section class="panel" id="panel" aria-label="Volume mixer">

    <div class="mini" id="mini" data-id="master" hidden>

        <label class="look-row" for="opt-blur">Background blur <input type="range" id="opt-blur" min="0" max="40"><span class="val" id="val-blur"></span></label>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const svg = (inner) => `<svg viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`;
  const SPK = '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>';
  const speaker = (level, muted) => {
    if (muted || level === 0) return svg(SPK + '<path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>');
    let s = SPK + '<path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/>';
    if (level >= 34) s += '<path d="M17.8 7.2a6.8 6.8 0 0 1 0 9.6"/>';
    if (level >= 67) s += '<path d="M20 5a10 10 0 0 1 0 14"/>';
    return svg(s);
  };
  const GLYPH = {
    music: '<path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/>',
    globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.6 3.5 5.5 3.5 8.5s-1.1 5.9-3.5 8.5c-2.4-2.6-3.5-5.5-3.5-8.5s1.1-5.9 3.5-8.5z"/>',
    voice: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13" width="4" height="6.5" rx="1.6"/><rect x="17" y="13" width="4" height="6.5" rx="1.6"/>',
    cube: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>',
    play: '<path d="M8 5.5v13l10.5-6.5z"/>',
    bell: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  };
  const I = {
    chev: svg('<path d="M6 9l6 6 6-6"/>'),
    pin: svg('<path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/>'),
    look: svg('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),
    close: svg('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>'),
    start: svg('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'),
    speakers: svg('<rect x="6" y="3" width="12" height="18" rx="2.5"/><circle cx="12" cy="14.5" r="3"/><circle cx="12" cy="7.5" r="1"/>'),
    headphones: svg('<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>'),
    monitor: svg('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/>'),
  };

  const DEVICES = [
    { id: 'speakers', name: 'Speakers', detail: 'Realtek(R) Audio' },
    { id: 'headphones', name: 'Headphones', detail: 'USB-C DAC' },
    { id: 'monitor', name: 'Display audio', detail: 'HDMI' },
  ];

  const apps = [
    { id: 'spotify', name: 'Spotify', sub: 'Now playing · Kundiman Sessions', glyph: 'music', c: '--app-music', vol: 72, f: 1.7 },
    { id: 'chrome', name: 'Google Chrome', sub: 'YouTube · lo-fi study stream', glyph: 'globe', c: '--app-web', vol: 55, f: 1.1 },
    { id: 'discord', name: 'Discord', sub: 'Voice · #capstone-team, 3 talking', glyph: 'voice', c: '--app-voice', vol: 85, f: 2.6 },
    { id: 'unity', name: 'Unity Editor', sub: 'Play mode · AR scene audio', glyph: 'cube', c: '--app-engine', vol: 40, f: .9 },
    { id: 'vlc', name: 'VLC media player', sub: 'Paused · lecture-week7.mp4', glyph: 'play', c: '--app-media', vol: 64, f: 1.3 },
    { id: 'system', name: 'System sounds', sub: 'Notifications and alerts', glyph: 'bell', c: '--app-sys', vol: 30, f: 3 },
  ].map((a, i) => ({ ...a, muted: false, out: 'default', bal: 0, level: 0, peak: 0, peakT: 0, ph: i * 1.9 }));
  const byId = Object.fromEntries(apps.map(a => [a.id, a]));

  const PROFILES = {
    default: { label: 'Default', vols: { spotify: 72, chrome: 55, discord: 85, unity: 40, vlc: 64, system: 30 }, muted: [] },
    gaming: { label: 'Gaming', vols: { spotify: 30, chrome: 20, discord: 92, unity: 82, vlc: 40, system: 15 }, muted: ['vlc'] },
    focus: { label: 'Focus', vols: { spotify: 48, chrome: 25, discord: 60, unity: 35, vlc: 50, system: 20 }, muted: ['discord', 'system'] },
    meeting: { label: 'Meeting', vols: { spotify: 12, chrome: 18, discord: 100, unity: 20, vlc: 30, system: 45 }, muted: ['spotify', 'unity'] },
  };

  const SIZES = { compact: { w: 300, h: null }, regular: { w: null, h: null }, wide: { w: 780, h: 560 } };
  const PREF_KEYS = ['mode', 'clear', 'blur', 'meters', 'w', 'h', 'sizePreset', 'min'];
  const state = { min: false, master: 78, masterMuted: false, device: 'speakers', mode: 'list', clear: 70, blur: 20, meters: true, profile: 'default', w: null, h: null, sizePreset: 'regular' };
  try {
    const saved = JSON.parse(localStorage.getItem('glass-mixer-prefs') || '{}');
    for (const k of PREF_KEYS) if (k in saved) state[k] = saved[k];
  } catch (e) { /* storage unavailable */ }
  const savePrefs = () => {
    try { localStorage.setItem('glass-mixer-prefs', JSON.stringify(Object.fromEntries(PREF_KEYS.map(k => [k, state[k]])))); } catch (e) {}
  };

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const panel = $('#panel'), desk = $('#desk'), list = $('#list'), board = $('#board');
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const pos = (v) => `calc(8px + (100% - 16px) * ${v / 100})`;
  const icon = (a) => `<span class="app-icon" style="--c: var(${a.c})">${svg(GLYPH[a.glyph])}</span>`;
  const deviceName = () => DEVICES.find(d => d.id === state.device).name;

  /* ---------- static chrome ---------- */
  $('#btn-pin').innerHTML = I.pin;
  $('#btn-look').innerHTML = I.look;
  $('#btn-close').innerHTML = I.close;
  $('#grip').innerHTML = svg('<path d="M4 14L14 4M4 9l5-5"/>');
  $('#btn-min').innerHTML = svg('<path d="M6 12.5h12"/>');
  $('#btn-restore').innerHTML = svg('<path d="M14 4h6v6M10 20H4v-6M20 4l-6.5 6.5M4 20l6.5-6.5"/>');
  $('#mini-drag').innerHTML = svg('<path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/>');
  $('#tb-start').innerHTML = I.start;
  $('#dev-chev').outerHTML = I.chev.replace('<svg', '<svg class="chev"');
  $('#dev').innerHTML = DEVICES.map(d => `<option value="${d.id}">${d.name} (${d.detail})</option>`).join('');

  const ed = $('#ed-body');
  const LINES = [[0, 34], [2, 10, 20], [2, 44], [4, 16, 12, 9], [4, 28], [2, 6], [0], [2, 14, 30], [4, 36], [4, 20, 14], [6, 24], [4, 8], [2, 6], [0], [2, 26, 10], [4, 18, 22]];
  const CC = ['--c1', '--c2', '--c4', '--c3'];
  ed.innerHTML = LINES.map((l, n) => `<div class="ed-line"><span class="n">${n + 1}</span><span style="width:${l[0] * 8}px"></span>${l.slice(1).map((w, k) => `<i style="width:${w * 5}px;background:var(${CC[(n + k) % 4]})"></i>`).join('')}</div>`).join('');

  $('#chips').innerHTML = Object.entries(PROFILES).map(([k, p]) => `<button class="chip" data-profile="${k}" aria-pressed="false">${p.label}</button>`).join('');

  list.innerHTML = apps.map(a => `
    <li class="app" data-id="${a.id}">
      <div class="app-main">
        ${icon(a)}
        <div class="app-body">
          <div class="app-top"><span class="app-name">${a.name}</span><span class="val" id="val-${a.id}"></span></div>
          <div class="app-sub">${a.sub}</div>
          <input type="range" id="vol-${a.id}" min="0" max="100" aria-label="${a.name} volume">
          <div class="meter"><i></i><b></b></div>
        </div>
        <button class="icon-btn mute" data-mute="${a.id}" aria-pressed="false"></button>
        <button class="icon-btn more" data-more="${a.id}" aria-expanded="false" aria-controls="extra-${a.id}" aria-label="More options for ${a.name}">${I.chev}</button>
      </div>
      <div class="app-extra" id="extra-${a.id}" hidden>
        <label class="extra-row" for="out-${a.id}">Output
          <select id="out-${a.id}" data-out="${a.id}">
            <option value="default">Default (${deviceName()})</option>
            ${DEVICES.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}
          </select>
        </label>
        <label class="extra-row" for="bal-${a.id}">Balance
          <input type="range" id="bal-${a.id}" data-bal="${a.id}" min="-100" max="100" step="5" value="0" aria-label="${a.name} left-right balance">
          <span class="val" id="balv-${a.id}">Center</span>
        </label>
      </div>
    </li>`).join('');

  const stripHTML = (id, name, iconHTML, extra = '') => `
    <div class="strip ${extra}" data-id="${id}">
      ${iconHTML}
      <div class="fader-zone">
        <div class="vmeter"><i></i></div>
        <div class="fader" id="fd-${id}" role="slider" tabindex="0" aria-label="${name} volume" aria-valuemin="0" aria-valuemax="100" aria-orientation="vertical">
          <span class="fill"></span><span class="knob"></span>
        </div>
      </div>
      <span class="val" id="sv-${id}"></span>
      <button class="icon-btn mute" data-mute="${id}" aria-pressed="false"></button>
      <span class="strip-name" title="${name}">${name}</span>
    </div>`;
  board.innerHTML =
    stripHTML('master', 'Master', `<span class="app-icon" style="--c: var(--accent)" id="master-chip"></span>`, 'master-strip') +
    apps.map(a => stripHTML(a.id, a.name.replace(' media player', '').replace('Google ', ''), icon(a))).join('');

  $('#mini-apps').innerHTML = apps.map(a => `<button class="mini-app" data-mini="${a.id}" aria-label="Open ${a.name}" title="${a.name}">${icon(a)}</button>`).join('');
  $('#tb-apps').innerHTML = apps.filter(a => a.id !== 'system').map(a => `<button class="tb-app" data-tb="${a.id}" aria-label="${a.name}">${icon(a)}</button>`).join('');

  /* ---------- rendering ---------- */
  const isMuted = (id) => id === 'master' ? state.masterMuted : byId[id].muted;
  const volOf = (id) => id === 'master' ? state.master : byId[id].vol;
  const effective = (a) => (a.muted || state.masterMuted) ? 0 : (a.vol / 100) * (state.master / 100);

  function render(id) {
    const v = volOf(id), m = isMuted(id), name = id === 'master' ? 'all' : byId[id].name;
    const range = $('#vol-' + id);
    if (+range.value !== v) range.value = v;
    range.style.setProperty('--p', pos(v));
    $('#val-' + id).textContent = v;
    const fd = $('#fd-' + id);
    fd.style.setProperty('--p', `calc(7px + (100% - 14px) * ${v / 100})`);
    fd.setAttribute('aria-valuenow', v);
    fd.setAttribute('aria-valuetext', m ? `${v}%, muted` : `${v}%`);
    $('#sv-' + id).textContent = v;
    document.querySelectorAll(`[data-mute="${id}"]`).forEach(b => {
      b.innerHTML = speaker(v, m);
      b.setAttribute('aria-pressed', m);
      b.setAttribute('aria-label', (m ? 'Unmute ' : 'Mute ') + name);
    });
    document.querySelectorAll(`[data-id="${id}"]`).forEach(el => el.classList.toggle('is-muted', m));
    if (id === 'master') {
      const mr = $('#vol-mini');
      if (+mr.value !== v) mr.value = v;
      mr.style.setProperty('--p', pos(v));
      $('#val-mini').textContent = v;
      $('#master-chip').innerHTML = speaker(v, m);
      $('#tray-vol').innerHTML = speaker(v, m) + `<span>${m ? 'Muted' : v + '%'}</span>`;
      $('#tray-vol').title = `${deviceName()}: ${m ? 'muted' : v + '%'}`;
    }
    if (reduce) drawStatic();
  }
  const renderAll = () => { render('master'); apps.forEach(a => render(a.id)); };

  function renderProfile() {
    document.querySelectorAll('[data-profile]').forEach(b => b.setAttribute('aria-pressed', b.dataset.profile === state.profile));
  }

  function setVol(id, v, opts = {}) {
    v = clamp(Math.round(v), 0, 100);
    if (id === 'master') {
      state.master = v;
      if (!opts.keepMute && state.masterMuted && v > 0) state.masterMuted = false;
      apps.forEach(a => reduce && render(a.id));
    } else {
      const a = byId[id];
      a.vol = v;
      if (!opts.keepMute && a.muted && v > 0) a.muted = false;
    }
    if (!opts.fromProfile && id !== 'master' && state.profile) { state.profile = null; renderProfile(); }
    render(id);
  }
  function toggleMute(id) {
    if (id === 'master') state.masterMuted = !state.masterMuted;
    else { byId[id].muted = !byId[id].muted; if (state.profile) { state.profile = null; renderProfile(); } }
    render(id);
  }

  function applyProfile(key) {
    const p = PROFILES[key];
    state.profile = key; renderProfile();
    apps.forEach(a => { a.muted = p.muted.includes(a.id); });
    const from = Object.fromEntries(apps.map(a => [a.id, a.vol]));
    if (reduce) { apps.forEach(a => setVol(a.id, p.vols[a.id], { fromProfile: true, keepMute: true })); return; }
    const t0 = performance.now(), dur = 280;
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      apps.forEach(a => setVol(a.id, from[a.id] + (p.vols[a.id] - from[a.id]) * e, { fromProfile: true, keepMute: true }));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* ---------- level meters ---------- */
  const playing = (a, t) => {
    switch (a.id) {
      case 'spotify': case 'chrome': return true;
      case 'discord': return Math.sin(t * .9 + 1) + Math.sin(t * 2.3) > .2;
      case 'unity': return Math.sin(t * .45) > -.3;
      case 'system': return (t % 7) < .4;
      default: return false;
    }
  };
  const meterEls = {};
  ['master', ...apps.map(a => a.id)].forEach(id => {
    const row = id === 'master' ? $('.master') : list.querySelector(`[data-id="${id}"]`);
    meterEls[id] = { bar: row.querySelector('.meter i'), peak: row.querySelector('.meter b'), v: board.querySelector(`[data-id="${id}"] .vmeter i`) };
  });
  meterEls.master.mini = $('#mini .meter i');
  meterEls.master.miniPeak = $('#mini .meter b');
  const master = { level: 0, peak: 0, peakT: 0 };
  function paint(id, o) {
    const el = meterEls[id];
    for (const [bar, peak] of [[el.bar, el.peak], [el.mini, el.miniPeak]]) {
      if (!bar) continue;
      bar.style.clipPath = `inset(0 ${(1 - o.level) * 100}% 0 0)`;
      peak.style.left = `calc(${o.peak * 100}% - 2px)`;
      peak.style.opacity = o.peak > .02 ? .55 : 0;
    }
    el.v.style.clipPath = `inset(${(1 - o.level) * 100}% 0 0 0)`;
  }
  function updateCounts(t) {
    const live = apps.filter(a => playing(a, t ?? 1) && effective(a) > 0);
    $('#app-count').textContent = `${live.length} of ${apps.length} making sound`;
    $('#foot-live').textContent = `Output: ${deviceName()}`;
    document.querySelectorAll('[data-tb]').forEach(b => b.classList.toggle('sounding', live.includes(byId[b.dataset.tb])));
    document.querySelectorAll('[data-mini]').forEach(b => b.classList.toggle('sounding', live.includes(byId[b.dataset.mini])));
  }
  function drawStatic() {
    let sum = 0;
    apps.forEach(a => { a.level = a.peak = playing(a, 1) ? Math.sqrt(effective(a)) * .6 : 0; sum += a.level * a.level; paint(a.id, a); });
    master.level = master.peak = state.masterMuted ? 0 : Math.min(1, Math.sqrt(sum)); paint('master', master);
    updateCounts(1);
  }
  let lastCount = 0;
  function frame(now) {
    const t = now / 1000;
    let sum = 0;
    for (const a of apps) {
      const eff = effective(a);
      let target = 0;
      if (eff > 0 && playing(a, t)) {
        const n = .55 + .22 * Math.sin(t * a.f * 3 + a.ph) + .18 * Math.sin(t * a.f * 7.3 + a.ph * 2);
        target = clamp(n * (.8 + Math.random() * .35), 0, 1) * Math.sqrt(eff);
      }
      a.level += (target - a.level) * (target > a.level ? .55 : .14);
      if (a.level >= a.peak) { a.peak = a.level; a.peakT = t; } else if (t - a.peakT > .9) a.peak = Math.max(a.level, a.peak - .012);
      sum += a.level * a.level;
      paint(a.id, a);
    }
    const mt = Math.min(1, Math.sqrt(sum) * .95);
    master.level += (mt - master.level) * .5;
    if (master.level >= master.peak) { master.peak = master.level; master.peakT = t; } else if (t - master.peakT > .9) master.peak = Math.max(master.level, master.peak - .012);
    paint('master', master);
    if (now - lastCount > 400) { updateCounts(t); lastCount = now; }
    requestAnimationFrame(frame);
  }

  /* ---------- appearance ---------- */
  function applyLook() {
    const root = document.documentElement.style;
    root.setProperty('--glass-a', (0.92 - state.clear / 100 * 0.88).toFixed(3));
    root.setProperty('--blur', state.blur + 'px');
    panel.classList.toggle('no-meters', !state.meters);
    $('#opt-clear').value = state.clear; $('#opt-clear').style.setProperty('--p', pos(state.clear));
    $('#opt-blur').value = state.blur; $('#opt-blur').style.setProperty('--p', pos(state.blur / 40 * 100));
    $('#val-clear').textContent = state.clear + '%';
    $('#val-blur').textContent = state.blur + 'px';
    $('#opt-meters').checked = state.meters;
  }
  /* ---------- size ---------- */
  // Width and height stay capped by the desk, so a saved size still fits a smaller screen.
  function applySize() {
    panel.style.width = state.w ? `min(${state.w}px, calc(100% - 32px))` : '';
    panel.style.height = state.h ? `min(${state.h}px, calc(100% - 122px))` : '';
    document.querySelectorAll('[data-size]').forEach(b => b.setAttribute('aria-pressed', b.dataset.size === state.sizePreset));
  }
  function setSizePreset(key) {
    state.sizePreset = key;
    state.w = SIZES[key].w; state.h = SIZES[key].h;
    applySize(); savePrefs(); flashBadge();
  }
  const badge = $('#size-badge');
  const tier = (w) => w <= 290 ? 'Mini' : w <= 340 ? 'Compact' : w < 560 ? 'Regular' : 'Wide';
  new ResizeObserver(() => {
    const r = panel.getBoundingClientRect();
    badge.textContent = `${tier(r.width)} · ${Math.round(r.width)} × ${Math.round(r.height)}`;
  }).observe(panel);
  let badgeTimer;
  function flashBadge() {
    badge.hidden = false; clearTimeout(badgeTimer);
    badgeTimer = setTimeout(() => { if (!panel.classList.contains('resizing')) badge.hidden = true; }, 1200);
  }

  function setMode(mode) {
    state.mode = mode;
    list.hidden = mode !== 'list';
    board.hidden = mode !== 'board';
    $('#mode-list').setAttribute('aria-pressed', mode === 'list');
    $('#mode-board').setAttribute('aria-pressed', mode === 'board');
  }

  /* ---------- events ---------- */
  panel.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'vol-mini') setVol('master', +t.value);
    else if (t.id.startsWith('vol-')) setVol(t.id.slice(4), +t.value);
    else if (t.dataset.bal) {
      const a = byId[t.dataset.bal], v = +t.value;
      a.bal = v;
      t.style.setProperty('--a', pos(Math.min(50, (v + 100) / 2)));
      t.style.setProperty('--p', pos(Math.max(50, (v + 100) / 2)));
      $('#balv-' + a.id).textContent = v === 0 ? 'Center' : (v < 0 ? 'L ' : 'R ') + Math.abs(v);
    }
    else if (t.id === 'opt-clear') { state.clear = +t.value; applyLook(); savePrefs(); }
    else if (t.id === 'opt-blur') { state.blur = +t.value; applyLook(); savePrefs(); }
  });
  panel.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'opt-meters') { state.meters = t.checked; applyLook(); savePrefs(); }
    else if (t.id === 'dev') {
      state.device = t.value;
      $('#dev-icon').innerHTML = I[state.device];
      document.querySelectorAll('[data-out] option[value="default"]').forEach(o => o.textContent = `Default (${deviceName()})`);
      render('master'); updateCounts();
    }
    else if (t.dataset.out) byId[t.dataset.out].out = t.value;
  });
  panel.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.mute) toggleMute(b.dataset.mute);
    else if (b.dataset.more) {
      const open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', open);
      $('#extra-' + b.dataset.more).hidden = !open;
    }
    else if (b.dataset.profile) applyProfile(b.dataset.profile);
    else if (b.dataset.size) setSizePreset(b.dataset.size);
    else if (b.dataset.mini) showPanel(true, b.dataset.mini);
    else if (b.id === 'btn-min') setMin(true);
    else if (b.id === 'btn-restore') setMin(false);
    else if (b.id === 'mode-list') { setMode('list'); savePrefs(); }
    else if (b.id === 'mode-board') { setMode('board'); savePrefs(); }
    else if (b.id === 'btn-pin') b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true');
    else if (b.id === 'btn-look') {
      const open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', open); $('#look').hidden = !open;
    }
    else if (b.id === 'btn-close') showPanel(false);
  });

  // Scroll the wheel over any app (row or strip) to nudge its volume.
  $('#p-scroll').addEventListener('wheel', (e) => {
    const row = e.target.closest('[data-id]');
    if (!row || e.target.closest('select')) return;
    e.preventDefault();
    const id = row.dataset.id;
    setVol(id, volOf(id) + (e.deltaY < 0 ? 2 : -2));
  }, { passive: false });

  // Vertical faders in Mixer layout.
  board.querySelectorAll('.fader').forEach(fd => {
    const id = fd.closest('[data-id]').dataset.id;
    const fromY = (y) => { const r = fd.getBoundingClientRect(); return (1 - (y - r.top - 7) / (r.height - 14)) * 100; };
    fd.addEventListener('pointerdown', (e) => { fd.setPointerCapture(e.pointerId); fd.focus(); setVol(id, fromY(e.clientY)); });
    fd.addEventListener('pointermove', (e) => { if (fd.hasPointerCapture(e.pointerId)) setVol(id, fromY(e.clientY)); });
    fd.addEventListener('keydown', (e) => {
      const big = e.shiftKey ? 10 : 1, v = volOf(id);
      const map = { ArrowUp: v + big, ArrowRight: v + big, ArrowDown: v - big, ArrowLeft: v - big, PageUp: v + 10, PageDown: v - 10, Home: 0, End: 100 };
      if (e.key in map) { e.preventDefault(); setVol(id, map[e.key]); }
    });
  });

  // Drag the panel by its header; double-click docks it back.
  // The minimized bar drags the same way.
  const head = $('#p-head'), mini = $('#mini');
  const off = { x: 0, y: 0 };
  let drag = null;
  const endDrag = () => { drag = null; panel.classList.remove('dragging'); };
  for (const handle of [head, mini]) {
    handle.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, input')) return;
      const r = panel.getBoundingClientRect(), d = desk.getBoundingClientRect();
      drag = { x: e.clientX, y: e.clientY, ox: off.x, oy: off.y,
        minX: off.x - (r.left - d.left), maxX: off.x + (d.right - r.right),
        minY: off.y - (r.top - d.top), maxY: off.y + (d.bottom - 52 - r.bottom) };
      handle.setPointerCapture(e.pointerId);
      panel.classList.add('dragging');
    });
    handle.addEventListener('pointermove', (e) => {
      if (!drag) return;
      off.x = clamp(drag.ox + e.clientX - drag.x, drag.minX, drag.maxX);
      off.y = clamp(drag.oy + e.clientY - drag.y, drag.minY, drag.maxY);
      panel.style.translate = `${off.x}px ${off.y}px`;
    });
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  }
  mini.addEventListener('wheel', (e) => {
    e.preventDefault();
    setVol('master', state.master + (e.deltaY < 0 ? 2 : -2));
  }, { passive: false });
  head.addEventListener('dblclick', (e) => { if (e.target.closest('button')) return; off.x = off.y = 0; panel.style.translate = ''; });

  // Resize from the top-left corner; the panel is anchored bottom-right, so it grows up and left.
  const grip = $('#grip');
  let rs = null;
  grip.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const r = panel.getBoundingClientRect(), d = desk.getBoundingClientRect();
    rs = { x: e.clientX, y: e.clientY, w: r.width, h: r.height, maxW: r.right - d.left - 16, maxH: r.bottom - d.top - 16 };
    grip.setPointerCapture(e.pointerId);
    panel.classList.add('resizing'); badge.hidden = false;
  });
  grip.addEventListener('pointermove', (e) => {
    if (!rs) return;
    state.w = Math.round(clamp(rs.w - (e.clientX - rs.x), 260, rs.maxW));
    state.h = Math.round(clamp(rs.h - (e.clientY - rs.y), 240, rs.maxH));
    state.sizePreset = null;
    applySize();
  });
  const endResize = () => { if (!rs) return; rs = null; panel.classList.remove('resizing'); flashBadge(); savePrefs(); };
  grip.addEventListener('pointerup', endResize);
  grip.addEventListener('pointercancel', endResize);
  grip.addEventListener('dblclick', () => setSizePreset('regular'));

  // Keep the panel on screen when the window shrinks or the panel expands.
  function keepOnScreen() {
    const r = panel.getBoundingClientRect(), d = desk.getBoundingClientRect();
    if (r.left < d.left || r.top < d.top || r.right > d.right || r.bottom > d.bottom - 52) {
      off.x = off.y = 0; panel.style.translate = '';
    }
  }
  window.addEventListener('resize', keepOnScreen);

  function setMin(min, animate = true) {
    state.min = min;
    panel.classList.toggle('is-min', min);
    mini.hidden = !min;
    for (const el of [head, $('#p-scroll'), $('.p-foot'), $('#grip')]) el.hidden = min;
    if (animate) { panel.classList.remove('pop'); void panel.offsetWidth; panel.classList.add('pop'); }
    (min ? $('#btn-restore') : $('#btn-min')).focus({ preventScroll: true });
    keepOnScreen();
    savePrefs();
  }

  function showPanel(show, focusId) {
    panel.hidden = !show;
    $('#tray-vol').setAttribute('aria-expanded', show);
    if (show && focusId && state.min) setMin(false, false);
    if (show) {
      panel.classList.remove('pop'); void panel.offsetWidth; panel.classList.add('pop');
      if (focusId) {
        if (state.mode !== 'list') setMode('list');
        const row = list.querySelector(`[data-id="${focusId}"]`);
        row.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
        row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
      }
    }
  }
  // Tray: hidden → show; minimized → expand; open → hide.
  $('#tray-vol').addEventListener('click', () => {
    if (panel.hidden) showPanel(true);
    else if (state.min) setMin(false);
    else showPanel(false);
  });
  $('#tb-apps').addEventListener('click', (e) => { const b = e.target.closest('[data-tb]'); if (b) showPanel(true, b.dataset.tb); });
  window.addEventListener('keydown', (e) => {
    if (!e.ctrlKey || !e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'v') { e.preventDefault(); showPanel(panel.hidden); }
    else if (k === 'm') { e.preventDefault(); if (panel.hidden) showPanel(true); setMin(!state.min); }
  });

  function tick() {
    const d = new Date();
    $('#clock').innerHTML = `${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}<small>${d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })}</small>`;
  }

  /* ---------- boot ---------- */
  $('#dev-icon').innerHTML = I[state.device];
  applyLook();
  applySize();
  setMode(state.mode);
  if (state.min) {
    state.min = true; panel.classList.add('is-min'); mini.hidden = false;
    for (const el of [head, $('#p-scroll'), $('.p-foot'), $('#grip')]) el.hidden = true;
  }
  renderAll();
  renderProfile();
  tick(); setInterval(tick, 30000);
  if (reduce) drawStatic(); else { updateCounts(0); requestAnimationFrame(frame); }
})();
</script>
