<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Glass Mixer</title>
  <!-- The mockup's typefaces, shipped with the app (tools/get-fonts.ps1), so no internet is needed. -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-edge="top">
  <!-- The mixer. It lives at a screen edge; drag the header to move it along that edge or to another one. -->
  <section class="panel" id="panel" aria-label="Volume mixer" hidden>
    <header class="p-head" id="p-head">
      <div class="p-title"><h1>Volume</h1><span>Drag to move along the edge</span></div>
      <div class="p-actions">
        <button class="icon-btn" id="btn-look" aria-expanded="false" aria-controls="look" title="Appearance" aria-label="Appearance"></button>
        <button class="icon-btn" id="btn-tuck" title="Tuck away (Ctrl+Alt+V)" aria-label="Tuck away"></button>
      </div>
    </header>

    <div class="p-scroll" id="p-scroll">
      <div class="p-inner" id="p-inner">
        <section class="master" data-id="master">
          <label class="dev" for="dev"><span id="dev-icon"></span><span class="dev-wrap"><select id="dev" aria-label="Output device"></select><span id="dev-chev"></span></span></label>
          <div class="master-row">
            <button class="icon-btn mute" data-mute="master" aria-pressed="false" aria-label="Mute all"></button>
            <div>
              <input type="range" class="vol" id="vol-master" min="0" max="100" aria-label="Master volume">
              <div class="meter"><i></i><b></b></div>
            </div>
            <span class="val vval" id="val-master">0</span>
          </div>
        </section>

        <div class="media" id="media">
          <section class="np" id="np" aria-label="Now playing" hidden>
            <div class="np-art" id="np-art"></div>
            <div class="np-info">
              <button class="np-src" id="np-src" title="Switch to another app that's playing"></button>
              <span class="np-title" id="np-title"></span>
              <span class="np-artist" id="np-artist"></span>
              <div class="np-progress" id="np-progress"><span id="np-time">0:00</span><div class="np-bar"><i id="np-fill"></i></div><span id="np-len">0:00</span></div>
            </div>
            <div class="np-ctrl">
              <button class="icon-btn" id="np-prev" aria-label="Previous"></button>
              <button class="icon-btn np-play" id="np-play" aria-label="Pause"></button>
              <button class="icon-btn" id="np-next" aria-label="Next"></button>
            </div>
          </section>

          <section class="mic" id="mic" aria-label="Microphone" hidden>
            <button class="icon-btn mic-mute" id="mic-mute" aria-pressed="false" aria-label="Mute microphone"></button>
            <div>
              <div class="mic-top"><span class="mic-name" id="mic-name">Microphone</span><span class="mic-use" id="mic-use">Not in use</span></div>
              <div class="meter"><i id="mic-level"></i></div>
            </div>
          </section>
        </div>

        <section class="look" id="look" hidden aria-label="Appearance">
          <label class="look-row" for="opt-clear">Transparency <input type="range" id="opt-clear" min="0" max="100"><span class="val" id="val-clear"></span></label>
          <label class="look-row" for="opt-blur">Background blur <input type="range" id="opt-blur" min="0" max="40"><span class="val" id="val-blur"></span></label>
          <label class="look-check" for="opt-tuck"><input type="checkbox" id="opt-tuck"> Tuck away when the mouse leaves</label>
          <label class="look-check" for="opt-activity"><input type="checkbox" id="opt-activity"> Show activity on the pill</label>
          <span class="look-sub">Automatic profiles</span>
          <label class="look-check" for="auto-meeting"><input type="checkbox" id="auto-meeting"> Meeting while a call is on (an app is using the mic)<span class="look-note" data-note="meeting"></span></label>
          <label class="look-check" for="auto-gaming"><input type="checkbox" id="auto-gaming"> Gaming while a game is open<span class="look-note" data-note="gaming"></span></label>
          <label class="look-check" for="auto-focus"><input type="checkbox" id="auto-focus"> Focus on weekdays, 9:00 to 17:00<span class="look-note" data-note="focus"></span></label>
        </section>

        <div class="bar">
          <div class="chips" id="chips" role="group" aria-label="Sound profiles"></div>
          <div class="seg" role="group" aria-label="Layout">
            <button id="mode-list" aria-pressed="true">List</button>
            <button id="mode-board" aria-pressed="false">Mixer</button>
          </div>
        </div>

        <div class="section-label"><span>Apps</span><span id="app-count"></span></div>
        <ul class="list" id="list"></ul>
        <div class="board" id="board" hidden></div>
        <p class="empty" id="empty" hidden>No app is playing sound right now. Start music or a video and it shows up here.</p>
      </div>
    </div>
  </section>

  <!-- The pill: the mixer tucked away at its edge. Compact: what's playing, live sound bars and
       the volume. For a moment it grows to show what changed. -->
  <button class="island" id="island" aria-label="Show the volume mixer" hidden>
    <span class="isl-compact"><span class="isl-art" id="isl-art" hidden></span><span class="isl-bars"><i></i><i></i><i></i><i></i><i></i></span><span class="isl-val" id="isl-val">0</span></span>
    <span class="isl-live" id="isl-live"></span>
    <span class="isl-mic" id="isl-mic" hidden></span>
  </button>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
